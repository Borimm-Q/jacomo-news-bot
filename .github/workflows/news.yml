name: jacomo-news-bot

on:
  # 정기 실행은 cron-job.org 가 workflow_dispatch 로 깨운다.
  # GitHub 자체 schedule 도 켜 두면 같은 분에 두 번 실행되어 Gemini 무료 티어
  # 분당 한도를 두 배로 태우므로(429 유발) 여기서는 쓰지 않는다.
  workflow_dispatch: {}

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: pip install -r requirements.txt
      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          MAX_POSTS_PER_RUN: "8"
        run: python src/main.py
      - name: save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/published.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push skipped"
          fi
